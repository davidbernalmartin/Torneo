<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=0.25, maximum-scale=4.0, user-scalable=yes">
<title>Cuadro RFFM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red:        #cc0000;
    --red-dark:   #a00000;
    --red-light:  #f9e6e6;
    --bg:         #f0f2f5;
    --white:      #ffffff;
    --text:       #1a1a1a;
    --text-muted: #777777;
    --border:     #d8d8d8;
    --win-green:  #16a34a;
    --win-bg:     #dcfce7;
    --win-border: #4ade80;
    --shadow:     0 2px 10px rgba(0,0,0,0.08);
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body:    'Barlow', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: auto;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    min-height: 56px;
    height: auto;
    background: var(--red);
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .logo-img { height: 28px; width: 28px; object-fit: contain; flex-shrink: 0; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(14px, 4vw, 20px); font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: white;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .save-indicator {
    font-size: 11px; font-weight: 500;
    color: rgba(255,255,255,0.6);
    display: flex; align-items: center; gap: 6px;
    transition: color 0.3s;
  }
  .save-indicator.saving { color: #fbbf24; }
  .save-indicator.saved  { color: #86efac; }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ── Bracket area ── */
  .bracket-outer {
    padding: 12px 16px 32px;
    overflow: auto;
    min-height: calc(100vh - 56px);
  }
  .bracket { position: relative; min-width: max-content; }

  /* ── Match cards ── */
  .match {
    background: var(--white);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }
  .match:hover { border-color: var(--red-dark); }
  .match-header {
    background: var(--red);
    padding: 5px 10px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .match-notes-input {
    font-size: 9px; font-weight: 400;
    color: rgba(255,255,255,0.75);
    font-style: italic;
    font-family: var(--font-body);
    text-transform: none; letter-spacing: normal;
    background: transparent;
    border: none; outline: none;
    width: 100%; padding: 0; margin: 0;
    cursor: text;
  }
  .match-notes-input::placeholder { color: rgba(255,255,255,0.4); font-style: italic; }
  .match-notes-input:focus { background: rgba(255,255,255,0.12); border-radius: 3px; padding: 0 3px; }
  .match-name {
    font-family: var(--font-display);
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: white;
  }

  /* ── Slots ── */
  .slot {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    min-height: 34px;
    border-bottom: 1px solid #f0f0f0;
    gap: 8px;
    background: white;
    transition: background 0.15s;
    cursor: default;
  }
  .slot:last-of-type { border-bottom: none; }
  .slot.has-team { cursor: grab; }
  .slot.has-team:active { cursor: grabbing; }
  .slot.winner {
    background: var(--win-bg);
    border-left: 3px solid var(--win-border);
  }
  .slot.loser { opacity: 0.4; }
  .slot.classified {
    background: var(--win-bg);
    border-left: 3px solid var(--win-border);
  }
  .slot.empty-slot {
    background: #fafafa;
    border: 1.5px dashed #e0e0e0;
    min-height: 34px;
  }
  .slot.empty-slot:hover {
    border-color: rgba(204,0,0,0.4);
    background: rgba(204,0,0,0.04);
  }
  .slot.drag-over {
    background: rgba(204,0,0,0.08) !important;
    border: 1.5px dashed rgba(204,0,0,0.5) !important;
  }
  .drop-hint { display: flex; align-items: center; gap: 7px; width: 100%; }

  .escudo {
    width: 20px; height: 20px;
    object-fit: contain; border-radius: 2px; flex-shrink: 0;
  }
  .escudo-placeholder {
    width: 20px; height: 20px;
    border-radius: 2px; flex-shrink: 0;
    background: #eeeeee;
    display: flex; align-items: center; justify-content: center;
  }
  .team-name {
    font-family: var(--font-display);
    font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em;
    color: #1a1a1a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .team-name.empty {
    font-family: var(--font-body);
    font-size: 11px; font-weight: 400;
    font-style: italic;
    color: #bbbbbb;
    text-transform: none;
  }
  .score {
    font-family: var(--font-display);
    font-size: 14px; font-weight: 800;
    min-width: 18px; text-align: center;
    color: var(--text);
  }
  .score.win  { color: var(--win-green); }
  .score.lose { color: #cccccc; }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 200;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(204,0,0,0.15);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  /* ── Error ── */
  #error-msg {
    margin: 32px; padding: 20px 24px;
    background: var(--red-light);
    border: 1px solid rgba(204,0,0,0.25);
    border-radius: 8px;
    font-size: 14px; line-height: 1.6;
    color: #660000;
    display: none;
  }
  #error-msg strong { color: var(--red); display: block; margin-bottom: 6px; font-size: 16px; }

  /* ── Menú de torneos ── */
  #menu-torneos {
    display: none;
    min-height: calc(100vh - 56px);
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
  }
  .menu-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    max-width: 1100px;
    width: 100%;
  }
  .menu-title {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .menu-lista-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
  }
  @media (max-width: 680px) {
    .menu-lista-grid { grid-template-columns: 1fr; }
  }
  .torneo-btn {
    width: 100%;
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 6px solid var(--red);
    border-radius: 15px;
    padding: 26px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.1s, border-color 0.15s;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    box-sizing: border-box;
  }
  .torneo-btn:hover {
    box-shadow: 0 6px 27px rgba(204,0,0,0.15);
    transform: translateY(-3px);
    border-color: var(--red);
  }
  .torneo-btn-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
  .torneo-btn-text { flex: 1; text-align: left; min-width: 0; }
  .torneo-btn-name {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text);
    display: block;
    white-space: normal; line-height: 1.2;
  }
  .torneo-btn-desc {
    font-family: var(--font-body);
    font-size: 15px; color: var(--text-muted);
    display: block; margin-top: 6px;
    white-space: normal; line-height: 1.3;
  }
  .torneo-btn-arrow { color: var(--red); font-size: 32px; font-weight: 700; flex-shrink: 0; }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    animation: fadein 0.15s ease;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    width: 520px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    animation: slidein 0.15s ease;
  }
  @keyframes slidein { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 {
    font-family: var(--font-display);
    font-size: 26px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text); margin-bottom: 28px;
  }
  .modal-teams { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
  .modal-team {
    display: flex; align-items: center; gap: 16px;
    background: #f8f8f8; border-radius: 10px; padding: 14px 18px;
  }
  .modal-team-name {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 700;
    text-transform: uppercase; color: var(--text); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .modal-team input {
    width: 80px; text-align: center;
    font-family: var(--font-display);
    font-size: 28px; font-weight: 800;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 6px;
    outline: none;
  }
  .modal-team input:focus { border-color: var(--red); }
  .vs-divider {
    text-align: center;
    font-family: var(--font-display);
    font-size: 15px; font-weight: 700; letter-spacing: 0.1em;
    color: #cccccc;
  }
  .modal-btns { display: flex; gap: 12px; margin-top: 28px; }
  .btn {
    flex: 1; padding: 16px;
    font-family: var(--font-display);
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    border: none; border-radius: 10px; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--red); color: white; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: #f0f0f0; color: #666; }
  .btn-secondary:hover { background: #e0e0e0; }

  /* ── Grupo grande: tarjeta clasificación ── */
  .group-card { cursor: pointer; }
  .group-card:hover .match-header { filter: brightness(1.12); }
  .group-stand-header {
    display: grid; grid-template-columns: 18px 1fr 22px 22px 25px;
    padding: 3px 10px 4px;
    font-size: 9.5px; font-weight: 700; color: #aaa;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: #f8f8f8; border-bottom: 1px solid #efefef;
  }
  .group-stand-header span { text-align: center; }
  .group-stand-header span:nth-child(2) { text-align: left; }
  .group-stand-row {
    display: grid; grid-template-columns: 18px 1fr 22px 22px 25px;
    padding: 5px 10px; font-size: 11.5px;
    border-bottom: 1px solid #f0f0f0; align-items: center;
    transition: background 0.1s;
  }
  .group-stand-row:last-child { border-bottom: none; }
  .group-stand-row.cl { background: var(--win-bg); border-left: 3px solid var(--win-border); }
  .stand-pos { font-size: 10px; font-weight: 800; color: #ccc; }
  .stand-pos.cl { color: var(--win-green); }
  .stand-name { font-family: var(--font-display); font-size: 12px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px; }
  .stand-name.cl { color: var(--win-green); }
  .stand-col { text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: #555; }
  .stand-col.pts { font-weight: 800; }
  .stand-col.pts.cl { color: var(--win-green); }

  /* ── Modal detalle de grupo ── */
  #group-detail {
    display: none; position: fixed; inset: 0; background: #f0f0f0;
    overflow-y: auto; z-index: 50;
  }
  .gd-header {
    background: var(--red); padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 1;
  }
  .gd-back {
    font-family: var(--font-display); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: rgba(255,255,255,0.9); background: none;
    border: 1px solid rgba(255,255,255,0.45); padding: 5px 12px;
    border-radius: 4px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .gd-back:hover { background: rgba(255,255,255,0.15); color: white; }
  .gd-title { font-family: var(--font-display); font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: white; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gd-body { padding: 10px 8px; }
  .gd-card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 10px; overflow: hidden; }
  .gmodal-sec { padding: 12px 12px; border-top: 1px solid #f0f0f0; }
  .gmodal-sec:first-of-type { border-top: none; }
  .gmodal-sec-title { font-family: var(--font-display); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--red); margin-bottom: 8px; }
  .stand-full { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .stand-full th { font-family: var(--font-display); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #aaa; padding: 5px 4px; text-align: center; border-bottom: 2px solid #f0f0f0; white-space: nowrap; }
  .stand-full th.rk { width: 28px; }
  .stand-full th.l { text-align: left; padding-left: 4px; }
  .stand-full th:nth-child(3),.stand-full th:nth-child(4),.stand-full th:nth-child(5) {width: 35px;}
  .stand-full td { padding: 9px 4px; border-bottom: 1px solid #f5f5f5; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: #333; }
  .stand-full td.rk { font-size: 17px; color: #bbb; width: 28px; }
  .stand-full td.l { text-align: left; padding-left: 4px; overflow: hidden; }
  .stand-eq { display: flex; align-items: center; }
  .stand-eq span { font-size: 20px; font-family: var(--font-display); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cl-tick { margin-left: 5px; color: var(--win-green); font-size: 16px; }
  .stand-full tr.cl td { background: var(--win-bg); }
  .stand-full tr.cl .stand-eq span { color: var(--win-green); }
  .stand-full tr.cl td.pts { color: var(--win-green); font-weight: 900; }
  .stand-full td.pts { font-weight: 900; font-size: 21px; }
  .stand-full tr.tied-row { cursor: grab; }
  .stand-full tr.tied-row td.rk { color: var(--red); opacity: 0.6; }
  .stand-full tr.dragging-row { opacity: 0.35; }
  .stand-full tr.drag-over-row td { box-shadow: 0 -2px 0 var(--red) inset; }
  .tie-hint { font-size: 11px; color: #bbb; font-family: var(--font-body); margin-bottom: 8px; font-style: italic; }
  .jornada-lbl { font-family: var(--font-display); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #bbb; margin: 10px 0 6px; }
  .partido-item { margin-bottom: 8px; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.09); }
  .partido-r { display: flex; align-items: center; gap: 8px; padding: 13px 8px; background: white; }
  .pr-local { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-transform: uppercase; text-align: right; flex: 1; min-width: 0; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pr-score { font-family: var(--font-display); font-weight: 900; font-size: 29px; min-width: 90px; text-align: center; color: #ccc; flex-shrink: 0; background: #f2f2f2; border-radius: 24px; padding: 7px 10px; line-height: 1; }
  .pr-score.played { color: var(--text); background: #efefef; }
  .pr-visit { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-transform: uppercase; text-align: left; flex: 1; min-width: 0; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .partido-meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 13px 9px; background: white; border-top: 1px solid #f0f0f0; font-size: 14px; font-family: var(--font-body); color: #999; }
  .meta-campo { text-align: left; flex-shrink: 0; }
  .meta-tiempo { text-align: right; }
  .pr-edit { flex-shrink: 0; font-size: 13px; color: var(--red); cursor: pointer; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; padding: 4px 10px; border: 1px solid rgba(204,0,0,0.3); border-radius: 4px; letter-spacing: 0.04em; user-select: none; }
  .pr-edit:hover { background: rgba(204,0,0,0.07); }
  .pen-badge { display: inline-block; font-size: 9px; font-weight: 800; font-family: var(--font-display); color: white; background: #e07b00; border-radius: 3px; padding: 1px 4px; letter-spacing: 0.04em; vertical-align: middle; margin: 0 2px; }
  .pen-section { margin-top: 20px; padding: 18px 20px; background: #fef7ec; border: 1.5px solid #fbd38d; border-radius: 12px; }
  .pen-section-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .pen-section-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #9a5700; }
  .pen-section-note { margin-left: auto; font-size: 13px; color: #c4a26b; font-style: italic; }
  .pen-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .pen-btn { flex: 1; min-width: 0; padding: 14px 16px; font-family: var(--font-display); font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border: 1.5px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pen-btn:hover:not(.selected) { border-color: #e07b00; color: #e07b00; }
  .pen-btn.selected { background: #e07b00; color: white; border-color: #e07b00; }
  .pen-btn.none-btn { flex: 0 0 auto; color: #c0c0c0; font-size: 13px; border-style: dashed; }
  .pen-btn.none-btn.selected { background: #f0f0f0; color: #888; border-color: #ccc; border-style: solid; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: #0f3d1a; border: 1px solid #2d7a3a;
    color: #86efac;
    font-family: var(--font-display);
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 8px 18px; border-radius: 8px;
    opacity: 0; transition: opacity 0.25s, transform 0.25s;
    pointer-events: none; white-space: nowrap; z-index: 300;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Resultados screen ── */
  #resultados-screen {
    display: none; position: fixed; inset: 0;
    background: var(--bg); overflow-y: auto; z-index: 60;
  }
  .rs-filters {
    background: white; border-bottom: 1px solid var(--border);
    padding: 10px 14px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    position: sticky; top: 40px; z-index: 1;
  }
  .rs-filter-lbl {
    font-family: var(--font-display); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted);
    white-space: nowrap;
  }
  .rs-filter-ctrl {
    font-family: var(--font-body); font-size: 14px;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; outline: none; color: var(--text); background: white; cursor: pointer;
  }
  .rs-filter-ctrl:focus { border-color: var(--red); }
  .rs-body { padding: 10px 12px; max-width: 640px; margin: 0 auto; }

  }
  .rs-pen-btn:hover:not(.selected) { border-color: var(--red); color: var(--red); }
  .rs-pen-btn.selected { background: var(--red); color: white; border-color: var(--red); }
  .rs-pen-none { flex: 0 0 auto; color: #ccc; border-style: dashed; font-size: 10px; }
  .rs-pen-none.selected { background: #f0f0f0; color: #999; border-color: #ccc; border-style: solid; }

  }
  .rs-check-lbl input[type=checkbox] { accent-color: var(--red); width: 15px; height: 15px; cursor: pointer; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Cargando cuadro...</p>
</div>

<div id="error-msg"></div>

<header>
  <div class="header-left">
    <img src="https://rffm-cms.s3.eu-west-1.amazonaws.com/favicon_87ea61909c.png" class="logo-img" alt="RFFM">
    <h1 id="bracket-title">Cuadro RFFM</h1>
  </div>
  <div class="header-right">
    <a id="btn-volver" href="bracket.html"
       style="display:none;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
              text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.85);
              text-decoration:none;border:1px solid rgba(255,255,255,0.4);
              padding:4px 10px;border-radius:4px;white-space:nowrap;">
      ‹ Torneos
    </a>
    <button onclick="openResultados()"
      style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
             text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,0.85);
             background:none;border:1px solid rgba(255,255,255,0.4);
             padding:4px 10px;border-radius:4px;white-space:nowrap;cursor:pointer;">
      📋 Resultados
    </button>
    <div class="save-indicator saved" id="save-indicator">
      <div class="save-dot"></div>
      <span id="save-text">Todo guardado</span>
    </div>
  </div>
</header>

<div id="menu-torneos">
  <div class="menu-inner">
    <p class="menu-title">Selecciona un torneo</p>
    <div id="menu-lista"></div>
  </div>
</div>

<div class="bracket-outer">
  <div class="bracket" id="bracket"></div>
</div>

<div id="group-detail"></div>

<div id="resultados-screen"></div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────
const SUPABASE_URL      = "https://bdqoapdnokydfwykitww.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkcW9hcGRub2t5ZGZ3eWtpdHd3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NjgwNzU1MywiZXhwIjoyMDkyMzgzNTUzfQ.rdMPUiAbe9qn04WXYm-5A1fTzMuExaXIN1G_YmyEles";
// ─────────────────────────────────────────────────────────

let fases = [], grupos = [], participantes = [], equipos = [], torneoData = null, partidos = [];
let eqMap = {};
let dragState = null;
let _penEditWinner = null;
let _standDrag = null;
let _penMultiTeam  = false;

// ── REST API ─────────────────────────────────────────────
function sbHeaders() {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=minimal"
  };
}

async function sbGet(table, params) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + (params ? "?" + params : ""), {
    headers: { ...sbHeaders(), "Accept": "application/json" }
  });
  if (!res.ok) throw new Error(table + " (" + res.status + "): " + await res.text());
  return res.json();
}

async function sbPatch(table, id, payload) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + id, {
    method: "PATCH", headers: sbHeaders(), body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error(table + " PATCH: " + await res.text());
}

async function sbPost(table, payload) {
  const headers = { ...sbHeaders(), "Prefer": "return=representation" };
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table, {
    method: "POST", headers, body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error(table + " POST: " + await res.text());
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}

function showError(msg) {
  const el = document.getElementById("error-msg");
  el.innerHTML = "<strong>Error</strong>" + msg;
  el.style.display = "block";
}

// ── MENÚ DE TORNEOS ──────────────────────────────────────
function showMenu(torneos) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("menu-torneos").style.display = "flex";
  document.querySelector(".bracket-outer").style.display = "none";

  const lista = document.getElementById("menu-lista");
  lista.innerHTML = "";
  if (!torneos.length) {
    lista.innerHTML = '<p style="color:var(--text-muted);font-size:14px;text-align:center;">No hay torneos configurados.</p>';
    return;
  }
  const grid = document.createElement("div");
  grid.className = "menu-lista-grid";
  lista.appendChild(grid);
  torneos.forEach(t => {
    const url = "bracket.html?torneo=" + t.id;
    const desc = t.descripcion ? `<span class="torneo-btn-desc">${t.descripcion}</span>` : "";
    const btn = document.createElement("a");
    btn.href = url;
    btn.className = "torneo-btn";
    btn.innerHTML = `
      <div class="torneo-btn-dot"></div>
      <div class="torneo-btn-text">
        <span class="torneo-btn-name">${t.nombre}</span>
        ${desc}
      </div>
      <span class="torneo-btn-arrow">›</span>`;
    grid.appendChild(btn);
  });
}

// ── INIT ─────────────────────────────────────────────────
async function init() {
  try {
    const torneoId = new URLSearchParams(window.location.search).get("torneo");

    if (!torneoId) {
      const torneos = await sbGet("torneos", "select=id,nombre,descripcion&order=created_at");
      showMenu(torneos);
      return;
    }

    const [f, e, t] = await Promise.all([
      sbGet("fases", "select=*&order=orden&torneo_id=eq." + torneoId),
      sbGet("equipos", "select=id,nombre,escudo_url&eliminado=eq.false&torneo_id=eq." + torneoId),
      sbGet("torneos", "select=id,nombre,campeon_id&id=eq." + torneoId),
    ]);
    fases = f; equipos = e;
    eqMap = {}; equipos.forEach(eq => eqMap[eq.id] = eq);
    torneoData = (t && t.length) ? t[0] : null;
    document.getElementById("btn-volver").style.display = "inline-block";
    if (torneoData?.nombre) {
      document.getElementById("bracket-title").textContent = torneoData.nombre;
      document.title = torneoData.nombre + " — Cuadro RFFM";
    }
    if (fases.length) {
      const faseIds = fases.map(f => f.id).join(",");
      grupos = await sbGet("grupos", "select=*&fase_id=in.(" + faseIds + ")");
      const grupoIds = grupos.map(gr => gr.id).join(",");
      const [p, pts] = await Promise.all([
        sbGet("participantes_grupo", "select=*&grupo_id=in.(" + grupoIds + ")"),
        grupoIds ? sbGet("partidos", "grupo_id=in.(" + grupoIds + ")&order=jornada") : Promise.resolve([]),
      ]);
      participantes = p.map(part => ({
        ...part,
        equipos: part.equipo_id ? (eqMap[part.equipo_id] || null) : null
      }));
      partidos = pts;
    }
    document.getElementById("loading").style.display = "none";
    if (!fases.length) { showError("No hay fases configuradas para este torneo."); return; }
    render();
  } catch(err) {
    document.getElementById("loading").style.display = "none";
    showError(err.message);
    console.error(err);
  }
}

// ── HELPERS ──────────────────────────────────────────────
const byGrupo = (gid) => participantes.filter(p => p.grupo_id === gid);
const getGrupo = (id)  => grupos.find(g => g.id === id);

function setSaveState(state) {
  const el = document.getElementById("save-indicator");
  const tx = document.getElementById("save-text");
  if (el) el.className = "save-indicator " + state;
  if (tx) tx.textContent = state === "saving" ? "Guardando..." : state === "saved" ? "Todo guardado" : "Error al guardar";
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// ── DRAG & DROP ───────────────────────────────────────────
function onDragStart(e, partId, equipoId) {
  dragState = { partId, equipoId };
  e.dataTransfer.effectAllowed = "move";
  e.currentTarget.style.opacity = "0.5";
}
function onDragEnd(e) {
  e.currentTarget.style.opacity = "";
  dragState = null;
}
function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add("drag-over");
}
function onDragLeave(e) {
  e.currentTarget.classList.remove("drag-over");
}

function getGrupoIdFromVirtualSlot(virtualId) {
  return virtualId.split("__")[1];
}

async function onDrop(e, targetPartId) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  if (!dragState || dragState.partId === targetPartId) return;

  const src = participantes.find(p => p.id === dragState.partId);
  if (!src || !src.equipo_id) { dragState = null; return; }

  const isVirtual = targetPartId.startsWith("vslot__");
  const tgt = isVirtual ? null : participantes.find(p => p.id === targetPartId);

  const srcGrupo = grupos.find(g => g.id === src.grupo_id);
  const srcFaseId = srcGrupo?.fase_id;

  let tgtFaseId = null;
  if (isVirtual) {
    const tgtGrupo = grupos.find(g => g.id === getGrupoIdFromVirtualSlot(targetPartId));
    tgtFaseId = tgtGrupo?.fase_id;
  } else if (tgt) {
    const tgtGrupo = grupos.find(g => g.id === tgt.grupo_id);
    tgtFaseId = tgtGrupo?.fase_id;
  }

  const sameFase = srcFaseId === tgtFaseId;
  dragState = null;

  if (sameFase && !isVirtual && tgt) {
    const srcEq = src.equipo_id, tgtEq = tgt.equipo_id;
    src.equipo_id = tgtEq; src.equipos = tgtEq ? (eqMap[tgtEq] || null) : null;
    tgt.equipo_id = srcEq; tgt.equipos = srcEq ? (eqMap[srcEq] || null) : null;
    render();
    setSaveState("saving");
    try {
      await Promise.all([
        sbPatch("participantes_grupo", src.id, { equipo_id: tgtEq || null }),
        sbPatch("participantes_grupo", tgt.id, { equipo_id: srcEq || null }),
      ]);
      setSaveState("saved");
      showToast("Equipos intercambiados");
    } catch(err) { setSaveState("error"); console.error(err); }

  } else if (!sameFase) {
    const srcEqId   = src.equipo_id;
    const srcEqData = eqMap[srcEqId] || null;

    if (isVirtual) {
      const tgtGrupoId = getGrupoIdFromVirtualSlot(targetPartId);
      setSaveState("saving");
      try {
        const existingInTarget = participantes.filter(p => p.grupo_id === tgtGrupoId);
        // Preferir rellenar un placeholder vacío existente en lugar de crear uno nuevo
        const emptySlot = existingInTarget.find(p => !p.equipo_id);
        if (emptySlot) {
          emptySlot.equipo_id = srcEqId;
          emptySlot.equipos   = srcEqData;
          render();
          await sbPatch("participantes_grupo", emptySlot.id, { equipo_id: srcEqId });
          await _syncPartidosSlot(tgtGrupoId, emptySlot.posicion, emptySlot.es_local, srcEqId);
        } else {
          // No hay placeholder: crear participante nuevo (caso sin partidos generados aún)
          const hasLocal = existingInTarget.some(p => p.es_local);
          const esLocal  = !hasLocal;
          const newPart = await sbPost("participantes_grupo", {
            grupo_id: tgtGrupoId, equipo_id: srcEqId,
            es_local: esLocal, goles: 0, puntos: 0,
          });
          participantes.push({ ...newPart, equipos: srcEqData });
          render();
        }
        setSaveState("saved");
        showToast("Clasificado a la siguiente fase ✓");
      } catch(err) { setSaveState("error"); console.error(err); }
    } else if (tgt) {
      tgt.equipo_id = srcEqId;
      tgt.equipos   = srcEqData;
      render();
      setSaveState("saving");
      try {
        await sbPatch("participantes_grupo", tgt.id, { equipo_id: srcEqId });
        await _syncPartidosSlot(tgt.grupo_id, tgt.posicion, tgt.es_local, srcEqId);
        setSaveState("saved");
        showToast("Clasificado a la siguiente fase ✓");
      } catch(err) { setSaveState("error"); console.error(err); }
    }
  }
}

// ── SCORE MODAL ───────────────────────────────────────────
let _penScoreWinner = null;

function _selectScorePenBtn(side) {
  _penScoreWinner = side;
  ['local', 'visit'].forEach(s => {
    const btn = document.getElementById('gs-pen-' + s);
    if (btn) btn.classList.toggle('selected', s === side);
  });
}

function openScoreModal(grupoId) {
  const g = getGrupo(grupoId);
  if (!g) return;
  const parts = byGrupo(grupoId);
  let local = parts.find(p => p.es_local) ?? parts[0] ?? null;
  let visit = parts.find(p => p !== local && !p.es_local) ?? parts.find(p => p !== local) ?? null;
  if (!local || !visit) return;
  const eqL = local.equipos;
  const eqV = visit.equipos;

  _penScoreWinner = null;
  if (g.penaltis_ganador_id) {
    if (local.equipo_id === g.penaltis_ganador_id)      _penScoreWinner = "local";
    else if (visit.equipo_id === g.penaltis_ganador_id) _penScoreWinner = "visit";
  } else if (g._pen_winner) {
    _penScoreWinner = g._pen_winner === "visitante" ? "visit" : g._pen_winner;
  }

  const oldModal = document.getElementById("score-modal");
  if (oldModal) oldModal.remove();

  const curL = local.goles ?? 0;
  const curV = visit.goles ?? 0;
  const isDraw = curL === curV && (local.goles != null);

  const div = document.createElement("div");
  div.className = "modal-backdrop";
  div.id = "score-modal";
  div.innerHTML = `
    <div class="modal">
      <h3>${g.nombre}</h3>
      <div class="modal-teams">
        <div class="modal-team">
          <span class="modal-team-name">${eqL?.nombre || "— local —"}</span>
          <input type="number" id="g-local" min="0" value="${local.goles ?? 0}">
        </div>
        <div class="vs-divider">VS</div>
        <div class="modal-team">
          <span class="modal-team-name">${eqV?.nombre || "— visitante —"}</span>
          <input type="number" id="g-visit" min="0" value="${visit.goles ?? 0}">
        </div>
      </div>
      <div class="pen-section" id="gs-pen-section" style="display:${isDraw ? 'block' : 'none'};">
        <div class="pen-section-hd">
          <span class="pen-section-title">Penaltis</span>
          <span class="pen-section-note">desempate</span>
        </div>
        <div class="pen-btns">
          <button type="button" id="gs-pen-local" class="pen-btn${_penScoreWinner === 'local' ? ' selected' : ''}" onclick="_selectScorePenBtn('local')">${eqL?.nombre || "Local"}</button>
          <button type="button" id="gs-pen-visit" class="pen-btn${_penScoreWinner === 'visit' ? ' selected' : ''}" onclick="_selectScorePenBtn('visit')">${eqV?.nombre || "Visitante"}</button>
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn btn-primary" onclick="saveScore('${grupoId}','${local.id}','${visit.id}')">Guardar</button>
        <button class="btn btn-secondary" onclick="document.getElementById('score-modal').remove()">Cancelar</button>
      </div>
    </div>`;
  div.addEventListener("click", e => { if (e.target === div) div.remove(); });
  document.body.appendChild(div);
  document.getElementById("g-local").focus();

  function _checkDraw() {
    const l = parseInt(document.getElementById("g-local")?.value) || 0;
    const v = parseInt(document.getElementById("g-visit")?.value) || 0;
    const sec = document.getElementById("gs-pen-section");
    if (!sec) return;
    const draw = l === v;
    sec.style.display = draw ? "block" : "none";
    if (!draw) { _penScoreWinner = null; ['local','visit'].forEach(s => document.getElementById('gs-pen-'+s)?.classList.remove('selected')); }
  }
  document.getElementById("g-local")?.addEventListener("input", _checkDraw);
  document.getElementById("g-visit")?.addEventListener("input", _checkDraw);
}

async function saveScore(grupoId, localId, visitId) {
  const gL = parseInt(document.getElementById("g-local").value) || 0;
  const gV = parseInt(document.getElementById("g-visit").value) || 0;
  const hasPen = gL === gV;
  const penWinVal = hasPen ? (_penScoreWinner || "") : "";

  const lp = participantes.find(p => p.id === localId);
  const vp = participantes.find(p => p.id === visitId);
  if (lp) lp.goles = gL;
  if (vp) vp.goles = gV;

  const g = grupos.find(g => g.id === grupoId);
  if (g) { g._penaltis = hasPen; g._pen_winner = penWinVal; }

  document.getElementById("score-modal").remove();
  _penScoreWinner = null;
  render();
  setSaveState("saving");
  try {
    const penGanadorId = (hasPen && penWinVal)
      ? (penWinVal === "local" ? lp?.equipo_id : vp?.equipo_id) || null
      : null;

    await Promise.all([
      sbPatch("participantes_grupo", localId, { goles: gL }),
      sbPatch("participantes_grupo", visitId, { goles: gV }),
    ]);

    try {
      await sbPatch("grupos", grupoId, { penaltis: hasPen, penaltis_ganador_id: penGanadorId });
      if (g) { g.penaltis = hasPen; g.penaltis_ganador_id = penGanadorId; }
    } catch(penErr) {
      console.warn("No se pudieron guardar los penaltis:", penErr);
      if (g) { g._penaltis = hasPen; g._pen_winner = penWinVal; g.penaltis_ganador_id = penGanadorId; }
    }

    // Sync result to the partidos record for this group
    const partido = partidos.find(p => p.grupo_id === grupoId);
    if (partido) {
      const lpIsLocal = partido.equipo_local_id
        ? partido.equipo_local_id === lp?.equipo_id
        : partido.pos_local === lp?.posicion;
      const resLocal = lpIsLocal ? gL : gV;
      const resVisit = lpIsLocal ? gV : gL;
      await sbPatch("partidos", partido.id, { resultado_local: resLocal, resultado_visitante: resVisit, penaltis_ganador_id: penGanadorId });
      partido.resultado_local = resLocal;
      partido.resultado_visitante = resVisit;
      partido.penaltis_ganador_id = penGanadorId;
    }

    setSaveState("saved");
    showToast("Resultado guardado");
    render();

    let winnerPart = null;
    if (hasPen && penWinVal) {
      winnerPart = penWinVal === "local" ? lp : vp;
    } else if (gL !== gV) {
      winnerPart = gL > gV ? lp : vp;
    }
    if (winnerPart?.equipo_id && g?.siguiente_grupo_id) {
      await advanceWinner(g, winnerPart.equipo_id);
    }

    // Auto-set champion if this is a final (last fase, no siguiente grupo)
    if (winnerPart?.equipo_id && !g?.siguiente_grupo_id) {
      const lastFase = fases[fases.length - 1];
      if (g && lastFase && g.fase_id === lastFase.id) {
        const torneoId = new URLSearchParams(window.location.search).get("torneo");
        if (torneoId) {
          await sbPatch("torneos", torneoId, { campeon_id: winnerPart.equipo_id });
          if (torneoData) torneoData.campeon_id = winnerPart.equipo_id;
          render();
          showToast("🏆 ¡Campeón guardado!");
        }
      }
    }
  } catch(err) {
    setSaveState("error");
    console.error(err);
    render();
  }
}

// Actualiza equipo_local/visitante_id en los partidos ya generados de un grupo
// cuando se clasifica un equipo para esa posición. Funciona para grupos de cualquier tamaño.
async function _syncPartidosSlot(grupoId, posicion, esLocal, equipoId) {
  if (!equipoId) return;

  const grupoPartidos = partidos.filter(p => p.grupo_id === grupoId);
  const patches = [];

  if (posicion == null) {
    // Grupos de 2 equipos: no tienen posicion numérica, usan es_local
    for (const p of grupoPartidos) {
      const upd = {};
      if (esLocal === true)  { p.equipo_local_id    = equipoId; upd.equipo_local_id    = equipoId; }
      if (esLocal === false) { p.equipo_visitante_id = equipoId; upd.equipo_visitante_id = equipoId; }
      if (Object.keys(upd).length) patches.push(sbPatch('partidos', p.id, upd));
    }
  } else {
    if (!grupos.some(gr => gr.id === grupoId)) return;
    for (const p of grupoPartidos) {
      const matchL = p.pos_local     === posicion;
      const matchV = p.pos_visitante === posicion;
      const upd = {};
      if (matchL) { p.equipo_local_id    = equipoId; upd.equipo_local_id    = equipoId; }
      if (matchV) { p.equipo_visitante_id = equipoId; upd.equipo_visitante_id = equipoId; }
      if (Object.keys(upd).length) patches.push(sbPatch('partidos', p.id, upd));
    }
  }
  if (patches.length) await Promise.all(patches);
}

async function advanceWinner(grupo, winnerEqId) {
  const sigGrupoId = grupo.siguiente_grupo_id;
  const posicion   = grupo.posicion_en_siguiente;
  const partsSig   = participantes.filter(p => p.grupo_id === sigGrupoId);

  let targetPart = null;
  if (posicion === "local") {
    targetPart = partsSig.find(p => p.es_local === true);
  } else if (posicion === "visitante") {
    targetPart = partsSig.find(p => p.es_local === false);
  } else {
    targetPart = partsSig.find(p => !p.equipo_id);
  }

  if (!targetPart) {
    showToast("⚠️ Configura las plazas del siguiente grupo primero");
    return;
  }

  targetPart.equipo_id = winnerEqId;
  targetPart.equipos   = eqMap[winnerEqId] || null;
  render();

  try {
    await sbPatch("participantes_grupo", targetPart.id, { equipo_id: winnerEqId });
    await _syncPartidosSlot(targetPart.grupo_id, targetPart.posicion, targetPart.es_local, winnerEqId);
    showToast("Ganador avanzado a la siguiente ronda ✓");
  } catch(err) {
    console.error("Error avanzando ganador:", err);
  }
}

// ── STANDINGS (grupos > 2 equipos) ───────────────────────

// Núcleo puro: recibe arrays de participantes y partidos directamente.
// Usado tanto por calcStandings (datos globales) como por rsAdvanceGroup (datos frescos de Supabase).
function _computeStandings(partsGrupo, gPartidos, manualOrder) {
  const stats = {};
  partsGrupo.forEach(p => {
    if (!p.equipo_id) return;
    stats[p.equipo_id] = { equipo_id: p.equipo_id, eq: eqMap[p.equipo_id] || null, PJ:0, PG:0, PE:0, PP:0, GF:0, GC:0, D:0, Pts:0, _isTied: false };
  });
  gPartidos.forEach(m => {
    const rl = m.resultado_local, rv = m.resultado_visitante;
    if (rl == null || rv == null) return;
    const sL = stats[m.equipo_local_id], sV = stats[m.equipo_visitante_id];
    if (sL) { sL.PJ++; sL.GF+=rl; sL.GC+=rv; sL.D+=rl-rv; if(rl>rv){sL.PG++;sL.Pts+=3;} else if(rl===rv){sL.PE++;sL.Pts++;} else sL.PP++; }
    if (sV) { sV.PJ++; sV.GF+=rv; sV.GC+=rl; sV.D+=rv-rl; if(rv>rl){sV.PG++;sV.Pts+=3;} else if(rv===rl){sV.PE++;sV.Pts++;} else sV.PP++; }
  });
  // Orden: Pts → h2h (partido/miniliga) → D global → penaltis h2h (partido/miniliga) → manual
  const all = Object.values(stats);
  all.sort((a, b) => b.Pts - a.Pts);
  const result = [];
  let i = 0;
  while (i < all.length) {
    let j = i + 1;
    while (j < all.length && all[j].Pts === all[i].Pts) j++;
    const group = all.slice(i, j);
    if (group.length > 1) {
      const ids = group.map(s => s.equipo_id);
      const h = {};
      ids.forEach(id => h[id] = { Pts: 0 });
      const pen = {};
      ids.forEach(id => pen[id] = 0);
      gPartidos.forEach(m => {
        if (!ids.includes(m.equipo_local_id) || !ids.includes(m.equipo_visitante_id)) return;
        const rl = m.resultado_local, rv = m.resultado_visitante;
        if (rl == null || rv == null) return;
        if (rl > rv) h[m.equipo_local_id].Pts += 3;
        else if (rl === rv) {
          h[m.equipo_local_id].Pts++;
          h[m.equipo_visitante_id].Pts++;
          if (m.penaltis_ganador_id && pen[m.penaltis_ganador_id] !== undefined)
            pen[m.penaltis_ganador_id]++;
        } else h[m.equipo_visitante_id].Pts += 3;
      });
      group.sort((a, b) => {
        const hA = h[a.equipo_id], hB = h[b.equipo_id];
        if (hB.Pts !== hA.Pts) return hB.Pts - hA.Pts;
        if (b.D !== a.D) return b.D - a.D;
        if (pen[b.equipo_id] !== pen[a.equipo_id]) return pen[b.equipo_id] - pen[a.equipo_id];
        const ia = manualOrder.indexOf(a.equipo_id);
        const ib = manualOrder.indexOf(b.equipo_id);
        if (ia >= 0 && ib >= 0) return ia - ib;
        return 0;
      });
      // Todos los equipos con los mismos puntos pueden reordenarse manualmente
      group.forEach(s => { s._isTied = true; });
    }
    group.forEach(s => result.push(s));
    i = j;
  }
  return result;
}

function calcStandings(grupoId) {
  const g = grupos.find(gr => gr.id === grupoId);
  const manualOrder = Array.isArray(g?.orden_desempate) ? g.orden_desempate : [];
  return _computeStandings(
    byGrupo(grupoId),
    partidos.filter(m => m.grupo_id === grupoId),
    manualOrder
  );
}

function advancingPositions(grupoNombre) {
  const posSet = new Set();
  participantes.forEach(p => {
    if (p.referencia_origen === grupoNombre && p.posicion_origen) posSet.add(p.posicion_origen);
  });
  return posSet;
}

function renderGroupCard(g, editable = false) {

  const isGroup = g.tipo_grupo > 2;
  const advPos = isGroup ? advancingPositions(g.nombre) : new Set();

  if (!anyPlayed) {
    const slotsHtml = [];
    for (let i = 0; i < g.tipo_grupo; i++) {
      const p = parts[i] || { id: `vslot__${g.id}__${i}`, equipo_id: null, equipos: null, _virtual: true };
      const eq = p.equipos;
      const borderStyle = isGroup
        ? `border-left:3px solid ${advPos.has(i + 1) ? 'var(--win-green)' : '#ddd'};`
        : '';

        const dragAttrs = editable
          ? `draggable="true" ondragstart="onDragStart(event,'${p.id}','${eq.id}')" ondragend="onDragEnd(event)"`
          : "";
        const dropAttrs = editable
          ? `ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${p.id}')"`
          : "";
        const badge = cl
          ? `<span style="font-size:10px;font-weight:800;color:var(--win-green);margin-left:auto;flex-shrink:0;">✓</span>`
          : "";
        slotsHtml.push(`<div class="slot has-team${cl ? ' classified' : ''}" style="${borderStyle}" ${dragAttrs} ${dropAttrs}>
          ${escudoEl(eq.escudo_url, eq.nombre)}
          <span class="team-name" style="color:var(--text);font-weight:800;">${eq.nombre}</span>
          ${badge}
        </div>`);
      } else {
        const label = p.id ? slotLabel(p.id) : 'plaza vacía';
        const dropAttrs = editable
          ? `ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${p.id}')"`
          : "";
        slotsHtml.push(`<div class="slot empty-slot" style="${borderStyle}" ${dropAttrs}>
          <div class="drop-hint">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="opacity:0.3"><circle cx="6" cy="6" r="5" stroke="#999" stroke-width="1.2"/><path d="M6 3v6M3 6h6" stroke="#999" stroke-width="1.2"/></svg>
            <span class="team-name empty">${label}</span>
          </div>
        </div>`);
      }
    }
    return `<div class="match" onclick="openGroupDetail('${g.id}')">
      <div class="match-header">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="match-name">${g.nombre}</span>
          <span style="font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:0.06em;text-transform:uppercase;">tabla ▾</span>
        </div>
        ${notasHtml}
      </div>
      ${slotsHtml.join('')}
    </div>`;
  }

  const standings = calcStandings(g.id);
  const rows = [];
  for (let i = 0; i < g.tipo_grupo; i++) {
    const s = standings[i];
    const borderStyle = isGroup
      ? `border-left:3px solid ${advPos.has(i + 1) ? 'var(--win-green)' : '#ddd'};`
      : '';
    if (s) {
      const cl = isClassified(s.equipo_id, g.id);
      const dStr = s.D > 0 ? '+' + s.D : '' + s.D;
      const escHtml = s.eq?.escudo_url
        ? `<img src="${s.eq.escudo_url}" style="width:16px;height:16px;object-fit:contain;" alt="">`
        : `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin:2px"><circle cx="6" cy="4" r="2.5" fill="#ccc"/><path d="M1 11c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="#ccc" stroke-width="1.2" fill="none"/></svg>`;
      rows.push(`<div class="group-stand-row${cl ? ' cl' : ''}" style="${borderStyle}">
        ${escHtml}

    }
  }
  return `<div class="match group-card" onclick="openGroupDetail('${g.id}')">
    <div class="match-header">
      <div style="display:flex;align-items:center;justify-content:space-between;">

      </div>
      ${notasHtml}
    </div>
    <div class="group-stand-header">
      <span></span><span>Equipo</span><span>PJ</span><span>D</span><span>Pts</span>
